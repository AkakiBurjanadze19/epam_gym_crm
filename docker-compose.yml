services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-crm-postgres
    environment:
      POSTGRES_DB: gymcrm
      POSTGRES_USER: gymcrm_user
      POSTGRES_PASSWORD: gymcrm_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcrm_user -d gymcrm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gym-crm-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-crm-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/gymcrm
      DB_USERNAME: gymcrm_user
      DB_PASSWORD: gymcrm_pass
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gym-crm-network

volumes:
  postgres_data:

networks:
  gym-crm-network:
    driver: bridge