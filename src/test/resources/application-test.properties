# Database - H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate - create-drop for clean test isolation
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging - Minimal for tests
logging.level.com.epam_final_project=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework=WARN

# Actuator - disable for tests
management.endpoints.web.exposure.include=none
management.endpoint.health.enabled=false
management.endpoint.health.probes.enabled=false

# Disable Prometheus metrics export for tests
management.prometheus.metrics.export.enabled=false

# Disable default metrics
management.metrics.enable.all=false
management.metrics.enable.jvm=false
management.metrics.enable.system=false
management.metrics.enable.process=false
management.metrics.enable.logback=false