# Database - H2 in-memory for local development
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate - create-drop for clean local testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
# Defer data.sql execution until after Hibernate creates the schema
spring.jpa.defer-datasource-initialization=true

# Logging - Debug level for local development
logging.level.com.epam_final_project=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Actuator - expose all endpoints for local development
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env,beans,conditions,configprops,mappings,threaddump,heapdump
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Prometheus metrics
management.prometheus.metrics.export.enabled=true

# Health endpoint groups
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Info endpoint
management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true