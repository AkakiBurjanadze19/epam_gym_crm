# Database - PostgreSQL for production (use environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate - validate for production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Initialization - disabled for production
spring.sql.init.mode=never

# Connection Pool - HikariCP settings for production
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# Logging - Error level for production
logging.level.com.epam_final_project=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.web=WARN
logging.pattern.level=%5p [${spring.application.name:},%X{transactionId:-}]

# Actuator - expose only essential endpoints for production
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Prometheus metrics
management.prometheus.metrics.export.enabled=true

# Health endpoint groups
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Info endpoint - minimal for production
management.info.env.enabled=false
management.info.build.enabled=true
management.info.git.enabled=true