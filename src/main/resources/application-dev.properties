# Database - PostgreSQL for development
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate - update for development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Connection Pool - HikariCP settings for dev
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Logging - Info level for development
logging.level.com.epam_final_project=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=DEBUG

# Actuator - expose monitoring endpoints for dev
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers,env,beans,conditions,configprops,mappings
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Prometheus metrics
management.prometheus.metrics.export.enabled=true

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Info endpoint
management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true